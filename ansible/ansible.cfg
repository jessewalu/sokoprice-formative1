# -----------------------------------------------------------------------------
# Ansible settings for the SokoPrice playbook. Run ansible commands from this
# directory so that this file is picked up.
# -----------------------------------------------------------------------------
[defaults]
# Static inventory (see inventory/README notes in ansible/README.md). For a
# dynamic inventory use:  -i inventory/aws_ec2.yml
inventory = inventory/hosts.ini
roles_path = roles
# The first connection to a new server records its SSH host key; a changed key
# afterwards is refused (protects against man-in-the-middle attacks).
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30
forks = 5
# Show secrets-free, readable results.
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
