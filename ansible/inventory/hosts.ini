# Static inventory. The address below is a documentation placeholder
# (203.0.113.0/24 is reserved for examples), so it will not reach a real server.
#
# Replace this file with the real one that Terraform generates:
#   cd ../terraform
#   terraform output -raw ansible_inventory > ../ansible/inventory/hosts.ini
#
# Or edit the line by hand: use your server's Elastic IP and SSH user.
[sokoprice]
sokoprice-dev-app ansible_host=203.0.113.10 ansible_port=22 ansible_user=ubuntu

[sokoprice:vars]
ansible_python_interpreter=/usr/bin/python3
