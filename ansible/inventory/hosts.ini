# Static inventory. The addresses below are documentation placeholders
# (203.0.113.0/24 is reserved for examples; 10.20.11.x is a private address), so
# they will not reach a real server.
#
# Replace this file with the real one that Terraform generates:
#   cd ../terraform
#   terraform output -raw ansible_inventory > ../ansible/inventory/hosts.ini
#
# The application server has no public address: Ansible reaches it by jumping
# through the bastion host (see group_vars/app.yml).
[bastion]
sokoprice-dev-bastion ansible_host=203.0.113.10

[app]
sokoprice-dev-app ansible_host=10.20.11.10

[sokoprice:children]
app

[all:vars]
ansible_user=ubuntu
ansible_port=22
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/sokoprice

[app:vars]
app_db_host=sokoprice-dev-example.abcdefghijkl.eu-north-1.rds.amazonaws.com
app_db_name=sokoprice
app_db_user=sokoprice
