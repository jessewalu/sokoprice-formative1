---
# Collections used by the playbook. Install with:
#   ansible-galaxy collection install -r requirements.yml
# (Not needed if you installed the full "ansible" package with pip.)
collections:
  - name: ansible.posix
    version: ">=1.5.0"
  - name: community.general
    version: ">=8.0.0"
  - name: community.docker
    version: ">=3.10.0"
  # Only needed for the dynamic inventory (inventory/aws_ec2.yml):
  - name: amazon.aws
    version: ">=8.0.0"
